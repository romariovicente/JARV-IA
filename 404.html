<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>J.A.R.V.I.S.</title>
    <script type="text/javascript">
      // Redireciona todas as rotas para o index.html mantendo o caminho original para o roteador do React
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
