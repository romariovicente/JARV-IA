<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Sistema Operacional Avançado</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome para ícones do sistema -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Conecta o Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Registra o Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(registration => {
            console.log('Service Worker registrado com sucesso:', registration);
          })
          .catch(error => {
            console.log('Falha ao registrar o Service Worker:', error);
          });
      });
    }
  </script>
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-terminal logo-icon"></i>
      <div class="brand-title">
        <span>J.A.R.V.I.S.</span> <small>v4.5 Core</small>
      </div>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <span>Status: <strong id="jarvStatus" class="text-cyan">Online</strong></span>
        <span class="clock-display" id="clockDisplay">00:00:00</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="userNameDisplay">Usuário</span>
        <button class="btn-logout" id="logoutBtn" style="display:none;" title="Sair"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="jarv-container">
    
    <!-- SIDEBAR LATERAL & HISTÓRICO -->
    <aside class="jarv-sidebar">
      <div class="sidebar-top-actions">
        <button class="btn-new-chat" onclick="createNewChat(true)">
          <i class="fa-solid fa-plus"></i> Nova Conversa
        </button>
        <button class="btn-clear-chat" title="Limpar Histórico e Resetar">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <div class="history-label">HISTÓRICO DE SESSÕES</div>
      <div class="chat-history-container">
        <div class="chat-history-list" id="chatHistoryList">
          <!-- Histórico preenchido dinamicamente via JS -->
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="jarv-nav-item active"><i class="fa-solid fa-brain"></i> Núcleo de IA</button>
        <button class="jarv-nav-item"><i class="fa-solid fa-shield-halved"></i> Kali Tools</button>
        <button class="jarv-nav-item"><i class="fa-solid fa-microchip"></i> Diagnóstico</button>
      </nav>
    </aside>

    <!-- PAINEL CENTRAL DE CHAT -->
    <main class="jarv-main">
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div class="msg-container" id="msgArea">
        <!-- Mensagens injetadas via JS -->
      </div>

      <!-- TERMINAL CLI INFERIOR -->
      <div class="terminal-cli-panel">
        <span class="user-host">romario@jarvis-core:~$</span> <span class="blinking-cursor">_</span>
      </div>

      <!-- BARRA DE FERRAMENTAS E CAMPO DE TEXTO (FIXADA) -->
      <div class="input-section">
        <div class="action-toolbar" style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
          <button class="tool-btn" id="btnCamera" title="Anexar Imagem / Câmera"><i class="fa-solid fa-camera"></i></button>
          <button class="tool-btn" id="btnAttachment" title="Anexar Arquivo"><i class="fa-solid fa-paperclip"></i></button>
          <button class="tool-btn" id="btnMic" title="Comando de Voz"><i class="fa-solid fa-microphone"></i></button>
          
          <!-- Escolha dinâmica por pesquisa para a voz da IA -->
          <label style="color: #00ffff; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; margin-left: auto;">
            <input type="checkbox" id="readAloudToggle" checked style="accent-color: #00ffff;"> Ouvir voz nesta pesquisa?
          </label>
          <!-- Botão de emergência para paralisar a voz -->
          <button class="tool-btn" id="btnStopSpeech" title="Paralisar Voz" onclick="stopJarvisVoice()" style="background: #ff4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">
            <i class="fa-solid fa-stop"></i> Parar Voz
          </button>
        </div>

        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Digite seu comando ou solicitação ao J.A.R.V.I.S..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" onclick="sendMsg()">ENVIAR</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE BOAS-VINDAS / CONFIGURAÇÃO DE NOME E GÊNERO -->
  <div class="modal-overlay" id="welcomeModal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-card modal-settings" style="text-align: center; background: #111; border: 1px solid #00ffff; padding: 30px; border-radius: 10px; max-width: 400px; width: 90%;">
      <div class="modal-logo" style="color: #00ffff; font-size: 40px; margin-bottom: 15px;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="color: #fff; margin-bottom: 10px;">J.A.R.V.I.S. SYSTEM</h2>
      <p class="subtitle" style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Insira seus dados para inicialização personalizada</p>
      
      <input type="text" id="setupName" placeholder="Digite seu nome..." style="width: 100%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px;" value="Romário">
      
      <div style="margin-bottom: 20px; text-align: left; color: #ccc; font-size: 14px;">
        <label style="display: block; margin-bottom: 8px;">Como deseja ser tratado?</label>
        <select id="setupGender" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px;">
          <option value="M">Masculino (Bem-vindo)</option>
          <option value="F">Feminino (Bem-vinda)</option>
        </select>
      </div>

      <button onclick="initJarvisSession()" style="width: 100%; padding: 12px; background: #00ffff; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">INICIAR SISTEMA</button>
    </div>
  </div>

  <!-- INPUTS OCULTOS DE SISTEMA -->
  <input type="file" id="imageInput" style="display: none;" accept="image/*" capture="environment">
  <input type="file" id="fileInput" style="display: none;" accept="*/*">

  <!-- SCRIPT DE CONTROLE E LÓGICA DO J.A.R.V.I.S. -->
  <script>
    let userData = { name: "Romário", gender: "M" };

    // Relógio em tempo real
    setInterval(() => {
      const now = new Date();
      const clockElem = document.getElementById('clockDisplay');
      if(clockElem) clockElem.innerText = now.toLocaleTimeString();
    }, 1000);

    function initJarvisSession() {
      const nameInput = document.getElementById('setupName').value.trim();
      if (!nameInput) {
        alert("Por favor, digite seu nome.");
        return;
      }
      
      userData.name = nameInput;
      userData.gender = document.getElementById('setupGender').value;
      
      const userNameDisplay = document.getElementById('userNameDisplay');
      if(userNameDisplay) userNameDisplay.innerText = userData.name;
      
      const welcomeModal = document.getElementById('welcomeModal');
      if(welcomeModal) welcomeModal.style.display = 'none';

      triggerWelcomeGreeting();
    }

    function getGreetingTime() {
      const hora = new Date().getHours();
      if (hora >= 5 && hora < 12) return "Bom dia";
      if (hora >= 12 && hora < 18) return "Boa tarde";
      if (hora >= 18 && hora < 24) return "Boa noite";
      return "Boa madrugada";
    }

    function triggerWelcomeGreeting() {
      const saudacaoHorario = getGreetingTime();
      const termoBemVindo = userData.gender === 'F' ? 'Bem-vinda' : 'Bem-vindo';
      
      const mensagemBoasVindas = `${saudacaoHorario}, ${userData.name}! Seja ${termoBemVindo} ao sistema J.A.R.V.I.S. Como eu posso te ajudar hoje?`;
      
      appendMessage("J.A.R.V.I.S.", mensagemBoasVindas);
      speakText(mensagemBoasVindas);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // Interrompe qualquer áudio pendente
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function stopJarvisVoice() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(userData.name, text);
      input.value = "";

      const respostaIA = `Comando recebido: "${text}". Processando os parâmetros operacionais do sistema.`;
      appendMessage("J.A.R.V.I.S.", respostaIA);

      // Verifica a escolha do usuário nesta pesquisa específica para ler ou não a resposta
      const desejaOuvir = document.getElementById('readAloudToggle').checked;
      if (desejaOuvir) {
        speakText(respostaIA);
      }
    }

    function appendMessage(sender, text) {
      const msgArea = document.getElementById('msgArea');
      if (!msgArea) return;
      
      const msgDiv = document.createElement('div');
      msgDiv.style.margin = "10px 0";
      msgDiv.style.padding = "10px";
      msgDiv.style.borderRadius = "8px";
      msgDiv.style.background = sender === "J.A.R.V.I.S." ? "#1a1a1a" : "#222";
      msgDiv.style.borderLeft = sender === "J.A.R.V.I.S." ? "3px solid #00ffff" : "3px solid #888";
      
      msgDiv.innerHTML = `<strong style="color: ${sender === "J.A.R.V.I.S." ? "#00ffff" : "#fff"};">${sender}:</strong> <span style="color: #ccc;">${text}</span>`;
      msgArea.appendChild(msgDiv);
      msgArea.scrollTop = msgArea.scrollHeight;
    }
  </script>
</body>
</html>
