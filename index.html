<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Sistema Operacional Avançado</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome para ícones do sistema -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-terminal logo-icon"></i>
      <div class="brand-title">
        <span>J.A.R.V.I.S.</span> <small>v4.5 Core</small>
      </div>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <span>Status: <strong id="jarvStatus" class="text-cyan">Inicializando...</strong></span>
        <span class="clock-display" id="clockDisplay">00:00:00</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="userName">Romário</span>
        <button class="btn-logout" id="logoutBtn" style="display:none;" title="Sair"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="jarv-container">
    
    <!-- SIDEBAR LATERAL & HISTÓRICO -->
    <aside class="jarv-sidebar">
      <div class="sidebar-top-actions">
        <button class="btn-new-chat" onclick="createNewChat(true)">
          <i class="fa-solid fa-plus"></i> Nova Conversa
        </button>
        <button class="btn-clear-chat" title="Limpar Histórico e Resetar">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <div class="history-label">HISTÓRICO DE SESSÕES</div>
      <div class="chat-history-container">
        <div class="chat-history-list" id="chatHistoryList">
          <!-- Histórico preenchido dinamicamente via JS -->
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="jarv-nav-item active"><i class="fa-solid fa-brain"></i> Núcleo de IA</button>
        <button class="jarv-nav-item"><i class="fa-solid fa-shield-halved"></i> Kali Tools</button>
        <button class="jarv-nav-item"><i class="fa-solid fa-microchip"></i> Diagnóstico</button>
      </nav>
    </aside>

    <!-- PAINEL CENTRAL DE CHAT -->
    <main class="jarv-main">
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div class="msg-container" id="msgArea">
        <!-- Mensagens injetadas via JS -->
      </div>

      <!-- TERMINAL CLI INFERIOR -->
      <div class="terminal-cli-panel">
        <span class="user-host">romario@jarvis-core:~$</span> <span class="blinking-cursor">_</span>
      </div>

      <!-- BARRA DE FERRAMENTAS E CAMPO DE TEXTO (FIXADA) -->
      <div class="input-section">
        <div class="action-toolbar">
          <button class="tool-btn" id="btnCamera" title="Anexar Imagem / Câmera"><i class="fa-solid fa-camera"></i></button>
          <button class="tool-btn" id="btnAttachment" title="Anexar Arquivo"><i class="fa-solid fa-paperclip"></i></button>
          <button class="tool-btn" id="btnMic" title="Comando de Voz"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Digite seu comando ou solicitação ao J.A.R.V.I.S..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" onclick="sendMsg()">ENVIAR</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE LOGIN / AUTENTICAÇÃO -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card modal-settings" style="text-align: center;">
      <div class="modal-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2>J.A.R.V.I.S. SYSTEM</h2>
      <p class="subtitle">Autenticação de Segurança Necessária</p>
      <button class="btn-google-login" id="loginBtn">
        <i class="fa-brands fa-google"></i> Entrar com Google
      </button>
    </div>
  </div>

  <!-- INPUTS OCULTOS DE SISTEMA (ACIONADOS PELOS BOTÕES DE CÂMERA E ANEXO) -->
  <input type="file" id="imageInput" style="display: none;" accept="image/*" capture="environment">
  <input type="file" id="fileInput" style="display: none;" accept="*/*">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Script Principal do J.A.R.V.I.S. -->
  <script src="js/app.js"></script>
</body>
</html>
