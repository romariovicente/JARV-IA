<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Sistema Operacional Avançado</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-terminal logo-icon"></i>
      <div class="brand-title">
        <span>J.A.R.V.I.S.</span> <small>v4.5 Core</small>
      </div>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <span>Status: <strong id="jarvStatus" class="text-cyan">Online</strong></span>
        <span class="clock-display" id="clockDisplay">00:00:00</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="userNameDisplay">Usuário</span>
      </div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="jarv-container">
    <main class="jarv-main" style="width: 100%; margin: 0;">
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div class="msg-container" id="msgArea"></div>

      <!-- BARRA DE FERRAMENTAS E CAMPO DE TEXTO -->
      <div class="input-section">
        <div class="action-toolbar" style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
          <label style="color: #00ffff; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer;">
            <input type="checkbox" id="readAloudToggle" checked style="accent-color: #00ffff;"> Ouvir resposta por voz nesta pesquisa?
          </label>
          <button class="tool-btn" id="btnStopSpeech" title="Paralisar Voz" onclick="stopJarvisVoice()" style="background: #ff4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">
            <i class="fa-solid fa-stop"></i> Parar Voz
          </button>
        </div>

        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Insira suas ordens, para análise do sistema..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" onclick="sendMsg()">EXECUTAR</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE BOAS-VINDAS E CONFIGURAÇÃO INICIAL -->
  <div class="modal-overlay" id="welcomeModal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-card" style="background: #111; border: 1px solid #00ffff; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%;">
      <div class="modal-logo" style="color: #00ffff; font-size: 40px; margin-bottom: 15px;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="color: #fff; margin-bottom: 10px;">J.A.R.V.I.S. PROTOCOL</h2>
      <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Identificação de credenciais para sincronização de interface.</p>
      
      <input type="text" id="setupName" placeholder="Insira seu nome..." style="width: 100%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px;" value="Romário">
      
      <div style="margin-bottom: 20px; text-align: left; color: #ccc; font-size: 14px;">
        <label style="display: block; margin-bottom: 8px;">Como prefere ser tratado?</label>
        <select id="setupGender" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px;">
          <option value="M">Masculino (Tratamento de Sir)</option>
          <option value="F">Feminino (Tratamento de Ma'am)</option>
        </select>
      </div>

      <button onclick="initJarvisSession()" style="width: 100%; padding: 12px; background: #00ffff; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">INICIALIZAR SISTEMA</button>
    </div>
  </div>

  <!-- SCRIPT DE CONTROLE E PERSONALIDADE J.A.R.V.I.S. -->
  <script>
    let userData = { name: "Romário", gender: "M" };

    // Relógio em tempo real
    setInterval(() => {
      const now = new Date();
      const clock = document.getElementById('clockDisplay');
      if(clock) clock.innerText = now.toLocaleTimeString();
    }, 1000);

    function initJarvisSession() {
      const nameInput = document.getElementById('setupName').value.trim();
      if (!nameInput) {
        alert("Por favor, insira um identificador válido.");
        return;
      }
      
      userData.name = nameInput;
      userData.gender = document.getElementById('setupGender').value;
      
      document.getElementById('userNameDisplay').innerText = userData.name;
      document.getElementById('welcomeModal').style.display = 'none';

      triggerWelcomeGreeting();
    }

    function getGreetingTime() {
      const hora = new Date().getHours();
      if (hora >= 5 && hora < 12) return "Bom dia";
      if (hora >= 12 && hora < 18) return "Boa tarde";
      if (hora >= 18 && hora < 24) return "Boa noite";
      return "Boa madrugada";
    }

    function triggerWelcomeGreeting() {
      const saudacaoHorario = getGreetingTime();
      const termoBemVindo = userData.gender === 'F' ? 'Bem-vinda' : 'Bem-vindo';
      const tratamento = userData.gender === 'F' ? 'Ma\'am' : 'Sir';
      
      const mensagemBoasVindas = `${saudacaoHorario}, ${tratamento} ${userData.name}. Seja ${termoBemVindo} aos sistemas do J.A.R.V.I.S. Como posso auxiliar em suas demandas operacionais hoje?`;
      
      appendMessage("J.A.R.V.I.S.", mensagemBoasVindas);
      speakText(mensagemBoasVindas);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 0.95; // Velocidade ligeiramente pausada
      utterance.pitch = 0.9;  // Tom de voz mais grave
      
      window.speechSynthesis.speak(utterance);
    }

    function stopJarvisVoice() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function fnGenerateJarvisResponse(text) {
      const lower = text.toLowerCase();
      const tratamento = userData.gender === 'F' ? 'Ma\'am' : 'Sir';

      if (lower.includes('ajuda') || lower.includes('socorro')) {
        return `Estou operacional e à disposição, ${tratamento}. Suas ordens são claras.`;
      } else if (lower.includes('quem é você') || lower.includes('seu criador')) {
        return `Sou o J.A.R.V.I.S., um sistema de inteligência artificial avançado projetado para gerenciar e otimizar suas diretrizes, ${tratamento}.`;
      } else {
        return `Compreendido, ${tratamento}. Os parâmetros da sua solicitação "${text}" foram registrados e estão sendo processados.`;
      }
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(userData.name, text);
      input.value = "";

      const respostaIA = fnGenerateJarvisResponse(text);
      appendMessage("J.A.R.V.I.S.", respostaIA);

      const desejaOuvir = document.getElementById('readAloudToggle')?.checked;
      if (desejaOuvir) {
        speakText(respostaIA);
      }
    }

    function appendMessage(sender, text) {
      const msgArea = document.getElementById('msgArea');
      if (!msgArea) return;
      
      const msgDiv = document.createElement('div');
      msgDiv.style.margin = "10px 0";
      msgDiv.style.padding = "10px";
      msgDiv.style.borderRadius = "8px";
      msgDiv.style.background = sender === "J.A.R.V.I.S." ? "#1a1a1a" : "#222";
      msgDiv.style.borderLeft = sender === "J.A.R.V.I.S." ? "3px solid #00ffff" : "3px solid #888";
      
      msgDiv.innerHTML = `<strong style="color: ${sender === "J.A.R.V.I.S." ? "#00ffff" : "#fff"};">${sender}:</strong> <span style="color: #ccc;">${text}</span>`;
      msgArea.appendChild(msgDiv);
      msgArea.scrollTop = msgArea.scrollHeight;
    }
  </script>
</body>
</html>
