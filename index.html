<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Advanced Quantum Operating System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-terminal logo-icon"></i>
      <div class="brand-title">
        <span>J.A.R.V.I.S.</span> <small>v5.0 Master Protocol</small>
      </div>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <span>Status: <strong id="jarvStatus" class="text-cyan">Optimal</strong></span>
        <span class="clock-display" id="clockDisplay">00:00:00</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="userNameDisplay">Romário</span>
      </div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="jarv-container">
    
    <!-- SIDEBAR DE AGENTES E MÓDULOS -->
    <aside class="jarv-sidebar">
      <div class="history-label">SUBSISTEMAS N2</div>
      <nav class="sidebar-nav">
        <button class="jarv-nav-item active" onclick="switchModule('master', event)"><i class="fa-solid fa-brain"></i> Master Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('brain', event)"><i class="fa-solid fa-network-wired"></i> Segundo Cérebro</button>
        <button class="jarv-nav-item" onclick="switchModule('gmail', event)"><i class="fa-solid fa-envelope"></i> Gmail Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('calendar', event)"><i class="fa-solid fa-calendar-days"></i> Calendar Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('airtable', event)"><i class="fa-solid fa-database"></i> Airtable CRM</button>
        <button class="jarv-nav-item" onclick="switchModule('tavily', event)"><i class="fa-solid fa-globe"></i> Tavily Search</button>
      </nav>
    </aside>

    <!-- PAINEL CENTRAL DE CHAT / CONHECIMENTO -->
    <main class="jarv-main">
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div class="msg-container" id="msgArea"></div>

      <!-- PAINEL SECUNDÁRIO DO SEGUNDO CÉREBRO -->
      <div id="brainModulePanel" style="display: none; flex: 1; flex-direction: column; gap: 15px; z-index: 2; overflow-y: auto; padding: 10px;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px;">
          <h3 style="color: var(--accent-cyan); margin-bottom: 10px;"><i class="fa-solid fa-book-bookmark"></i> Base de Conhecimento - Segundo Cérebro</h3>
          <input type="text" id="brainSearchInput" placeholder="Pesquisar notas, marcações ou documentações..." style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none;" oninput="filterBrainNotes()">
        </div>
        <div id="brainNotesList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Notas injetadas dinamicamente -->
        </div>
      </div>

      <!-- BARRA DE FERRAMENTAS E CAMPO DE TEXTO -->
      <div class="input-section" id="chatInputSection">
        <div class="action-toolbar" style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
          <button class="tool-btn" id="btnMicGlobal" title="Ativar Atalho de Voz (Espaço)" style="background: #222; border: 1px solid #00ffff; color: #00ffff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-microphone"></i> Pressione [ESPAÇO] para falar
          </button>
          
          <label style="color: #00ffff; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; margin-left: auto;">
            <input type="checkbox" id="readAloudToggle" checked style="accent-color: #00ffff;"> Ouvir voz do sistema?
          </label>
          <button class="tool-btn" id="btnStopSpeech" title="Paralisar Voz" onclick="stopJarvisVoice()" style="background: #ff4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-stop"></i> Parar Voz
          </button>
        </div>

        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Insira suas diretrizes para o Master Agent..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" onclick="sendMsg()">EXECUTAR</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE BOAS-VINDAS E CONFIGURAÇÃO INICIAL -->
  <div class="modal-overlay" id="welcomeModal" style="display: flex;">
    <div class="modal-card">
      <div class="modal-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="color: #fff; margin-bottom: 10px;">J.A.R.V.I.S. CORE AUTH</h2>
      <p class="subtitle">Sincronização de credenciais de acesso exigida.</p>
      
      <div class="setting-group">
        <label>Identificador do Operador:</label>
        <input type="text" id="setupName" value="Romário" style="background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; outline: none; width: 100%;">
      </div>
      
      <div class="setting-group">
        <label>Protocolo de Tratamento:</label>
        <select id="setupGender">
          <option value="M">Masculino (Sir)</option>
          <option value="F">Feminino (Ma'am)</option>
        </select>
      </div>

      <button onclick="initJarvisSession()" class="btn-send" style="width: 100%; padding: 12px; margin-top: 10px; justify-content: center;">AUTORIZAR ACESSO</button>
    </div>
  </div>

  <!-- SCRIPT DE CONTROLE, VOZ E COMPORTAMENTO -->
  <script>
    let userData = { name: "Romário", gender: "M" };
    let activeModule = "master";

    let brainNotes = [
      { id: 1, title: "Diretrizes N2 - Stone e TON", category: "Suporte", desc: "Procedimentos de escalação interna, Help Fin, Salesforce, Oráculo e portais de atendimento." },
      { id: 2, title: "Manutenção de Dispositivos Xiaomi", category: "Técnico", desc: "Comandos MTP, Unlock Tools e restrições de software para MIUI 15." },
      { id: 3, title: "Mecânica de Exercícios e Física", category: "Estudo", desc: "Decomposição de forças em planos inclinados no Leg Press (150 kg, 45°, fórmula Px = P * sin(45°))." },
      { id: 4, title: "Logística e Processos - Mercado Livre", category: "Carreira", desc: "Diretrizes de alinhamento para processos seletivos e operações logísticas." }
    ];

    // Relógio em tempo real
    setInterval(() => {
      const now = new Date();
      const clock = document.getElementById('clockDisplay');
      if(clock) clock.innerText = now.toLocaleTimeString();
    }, 1000);

    // Atalho global com a tecla Espaço
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        input.focus();
        speakText(`À sua disposição, ${userData.gender === 'F' ? "Ma'am" : 'Sir'}. Ouvindo comando.`);
      }
    });

    function initJarvisSession() {
      const nameInput = document.getElementById('setupName').value.trim();
      if (!nameInput) {
        alert("Identificador inválido.");
        return;
      }
      
      userData.name = nameInput;
      userData.gender = document.getElementById('setupGender').value;
      
      document.getElementById('userNameDisplay').innerText = userData.name;
      document.getElementById('welcomeModal').style.display = 'none';

      triggerWelcomeGreeting();
    }

    function getGreetingTime() {
      const hora = new Date().getHours();
      if (hora >= 5 && hora < 12) return "Bom dia";
      if (hora >= 12 && hora < 18) return "Boa tarde";
      if (hora >= 18 && hora < 24) return "Boa noite";
      return "Boa madrugada";
    }

    function triggerWelcomeGreeting() {
      const saudacaoHorario = getGreetingTime();
      const tratamento = userData.gender === 'F' ? 'Ma\'am' : 'Sir';
      
      const mensagemBoasVindas = `${saudacaoHorario}, ${tratamento} ${userData.name}. Todos os agentes especialistas e o Segundo Cérebro estão sincronizados. Como posso auxiliar em suas diretrizes hoje?`;
      
      appendMessage("J.A.R.V.I.S.", mensagemBoasVindas);
      speakText(mensagemBoasVindas);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 0.90; 
      utterance.pitch = 0.85; 
      
      window.speechSynthesis.speak(utterance);
    }

    function stopJarvisVoice() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function switchModule(moduleName, event) {
      document.querySelectorAll('.jarv-nav-item').forEach(btn => btn.classList.remove('active'));
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }

      activeModule = moduleName;
      const msgArea = document.getElementById('msgArea');
      const brainPanel = document.getElementById('brainModulePanel');
      const inputSection = document.getElementById('chatInputSection');
      const inputField = document.getElementById('chatInput');

      if (moduleName === 'brain') {
        msgArea.style.display = 'none';
        brainPanel.style.display = 'flex';
        inputSection.style.display = 'none';
        loadBrainNotes();
      } else {
        brainPanel.style.display = 'none';
        msgArea.style.display = 'flex';
        inputSection.style.display = 'flex';

        const placeholders = {
          master: "Insira suas diretrizes para o Master Agent...",
          gmail: "Digite o comando para o Gmail Agent (ex: enviar rascunho, buscar e-mails)...",
          calendar: "Digite o evento ou consulta para o Calendar Agent...",
          airtable: "Consulte registros ou atualize o Airtable CRM...",
          tavily: "Insira o termo de pesquisa avançada para o Tavily Search..."
        };
        inputField.placeholder = placeholders[moduleName] || "Insira sua diretriz...";
      }
    }

    function loadBrainNotes(filterQuery = "") {
      const notesList = document.getElementById('brainNotesList');
      const filtered = brainNotes.filter(n => 
        n.title.toLowerCase().includes(filterQuery) || 
        n.desc.toLowerCase().includes(filterQuery) || 
        n.category.toLowerCase().includes(filterQuery)
      );

      if (filtered.length === 0) {
        notesList.innerHTML = `<div style="color: var(--text-muted); padding: 10px;">Nenhum registro encontrado na base de conhecimento.</div>`;
        return;
      }

      notesList.innerHTML = filtered.map(note => `
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px;">
          <strong style="color: var(--accent-cyan);">${note.title}</strong> <span style="font-size: 0.8rem; color: var(--text-muted);">[${note.category}]</span>
          <p style="color: var(--text-main); font-size: 0.9rem; margin-top: 5px;">${note.desc}</p>
        </div>
      `).join('');
    }

    function filterBrainNotes() {
      const query = document.getElementById('brainSearchInput').value.toLowerCase();
      loadBrainNotes(query);
    }

    function saveToSecondBrain(title, category, desc) {
      const newNote = { id: Date.now(), title, category, desc };
      brainNotes.unshift(newNote);
    }

    function fnGenerateAgentResponse(module, text) {
      const tratamento = userData.gender === 'F' ? 'Ma\'am' : 'Sir';

      switch(module) {
        case 'gmail':
          saveToSecondBrain(`Email - ${text.substring(0, 25)}...`, "Gmail", `Comando executado: ${text}`);
          return `Subagente do Gmail acionado com sucesso, ${tratamento}. O rascunho de e-mail foi formatado em HTML e o histórico foi arquivado no Segundo Cérebro.`;
        
        case 'calendar':
          saveToSecondBrain(`Agenda - ${text.substring(0, 25)}...`, "Calendar", `Agendamento: ${text}`);
          return `Sincronização de fuso horário concluída pelo Calendar Agent, ${tratamento}. O evento foi registrado na base de dados.`;
        
        case 'airtable':
          saveToSecondBrain(`CRM - ${text.substring(0, 25)}...`, "Airtable", `Consulta/Registro CRM: ${text}`);
          return `Airtable CRM consultado com êxito, ${tratamento}. Os parâmetros foram atualizados no repositório de conhecimento.`;
        
        case 'tavily':
          saveToSecondBrain(`Pesquisa - ${text.substring(0, 25)}...`, "Tavily", `Busca web: ${text}`);
          return `Tavily Search executou varredura profunda na web para "${text}", ${tratamento}. Os resultados relevantes já estão salvos no Segundo Cérebro.`;
        
        default:
          saveToSecondBrain(`Diretriz Master - ${text.substring(0, 25)}...`, "Master", `Diretriz: ${text}`);
          return `Diretriz "${text}" processada pelo Master Agent, ${tratamento}. Os nós especialistas foram sincronizados e o registro foi gravado no Segundo Cérebro.`;
      }
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(userData.name, text);
      input.value = "";

      const respostaIA = fnGenerateAgentResponse(activeModule, text);
      appendMessage("J.A.R.V.I.S.", respostaIA);

      const desejaOuvir = document.getElementById('readAloudToggle')?.checked;
      if (desejaOuvir) {
        speakText(respostaIA);
      }
    }

    function appendMessage(sender, text) {
      const msgArea = document.getElementById('msgArea');
      if (!msgArea) return;
      
      const msgDiv = document.createElement('div');
      const isBot = sender === "J.A.R.V.I.S.";
      
      msgDiv.className = `jarv-msg ${isBot ? 'jarv-msg-bot' : 'jarv-msg-user'}`;
      msgDiv.innerHTML = `<strong style="color: ${isBot ? 'var(--accent-cyan)' : '#ffffff'};">${sender}:</strong> <span style="color: var(--text-main);">${text}</span>`;
      msgArea.appendChild(msgDiv);
      msgArea.scrollTop = msgArea.scrollHeight;
    }
  </script>
</body>
</html>
