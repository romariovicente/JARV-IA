<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARV.IA - Secure Access Portal</title>
  <!-- Link relativo apontando para a mesma pasta -->
  <link rel="stylesheet" href="./styles.css">
  <!-- Ícones FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-dragon logo-icon"></i>
      <span class="brand-title">JARV.IA <small>Rolling Release</small></span>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <i class="fa-solid fa-terminal"></i>
        <i class="fa-solid fa-volume-high"></i>
        <i class="fa-solid fa-bell"></i>
        <span class="clock-display">09:53</span>
        <i class="fa-solid fa-lock text-cyan"></i>
      </div>
      <div class="user-profile">
        <span id="userName" class="user-name">Romário</span>
        <button id="logoutBtn" class="btn-logout" style="display:none;">Sair</button>
      </div>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <div class="jarv-container">

    <!-- MENU LATERAL (SIDEBAR) -->
    <aside class="jarv-sidebar">
      <nav class="sidebar-nav">
        <button class="jarv-nav-item active" data-view="chat" onclick="switchView('chat')">
          <i class="fa-solid fa-terminal"></i> Terminal / Chat
        </button>
        <button class="jarv-nav-item" data-view="dashboard" onclick="switchView('dashboard')">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </button>
        <button class="jarv-nav-item" data-view="agents" onclick="switchView('agents')">
          <i class="fa-solid fa-robot"></i> Agentes
        </button>
        <button class="jarv-nav-item" data-view="memory" onclick="switchView('memory')">
          <i class="fa-solid fa-brain"></i> Memória
        </button>
        <button class="jarv-nav-item" data-view="pcg" onclick="switchView('pcg')">
          <i class="fa-solid fa-microchip"></i> PCG
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-reset" onclick="resetSystem()">
          <i class="fa-solid fa-power-off"></i> Reiniciar
        </button>
      </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL (CHAT & TERMINAL) -->
    <main class="jarv-main" id="chatView">
      
      <!-- Fundo Marca d'Água Kali -->
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div id="msgArea" class="msg-container">
        <div class="jarv-msg jarv-msg-system">
          <span class="jarv-code">[JARV]</span> Sistema inicializado. Arquitetura: Frontend → Backend → Model Router. Aguardando comandos.
        </div>
      </div>

      <!-- PAINEL TERMINAL INFERIOR (Status CLI) -->
      <div class="terminal-cli-panel">
        <div class="cli-line"><span class="user-host">romario@jarv-ia:~#</span> status: <span id="jarvStatus">Awaiting Authentication</span></div>
        <div class="cli-line"><span class="user-host">romario@jarv-ia:~#</span> <span class="blinking-cursor">_</span></div>
      </div>

      <!-- BARRA DE FERRAMENTAS E INPUT -->
      <div class="input-section">
        <div class="action-toolbar">
          <button class="tool-btn" title="Câmera"><i class="fa-solid fa-camera"></i></button>
          <button class="tool-btn" title="Imagem"><i class="fa-solid fa-image"></i></button>
          <button class="tool-btn" title="Anexo"><i class="fa-solid fa-paperclip"></i></button>
          <button class="tool-btn" title="Voz"><i class="fa-solid fa-microphone"></i></button>
          <button class="tool-btn" title="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="tool-btn" title="Configurações"><i class="fa-solid fa-gear"></i></button>
        </div>

        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Digite um comando..." onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" onclick="sendMsg()">ENVIAR</button>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL DE LOGIN (Exibido via script se deslogado) -->
  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <i class="fa-solid fa-dragon modal-logo"></i>
      <h2>JARV.IA</h2>
      <p class="subtitle">Rolling Release</p>

      <button id="loginBtn" class="btn-google-login">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Sign in with Google
      </button>

      <a href="#" class="alt-login-link">Alternative Kali Terminal Login</a>
    </div>
  </div>

  <!-- Scripts Firebase & App -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="./app.js"></script>
</body>
</html>
