<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Advanced Quantum Operating System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</head>
<body class="kali-theme">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="jarv-header">
    <div class="header-left">
      <i class="fa-solid fa-terminal logo-icon"></i>
      <div class="brand-title">
        <span>J.A.R.V.I.S.</span> <small>v5.1 Master Protocol</small>
      </div>
    </div>
    <div class="header-right">
      <div class="system-controls">
        <span>Status: <strong id="jarvStatus" class="text-cyan">Optimal</strong></span>
        <span class="clock-display" id="clockDisplay">00:00:00</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="userNameDisplay">Romário</span>
      </div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="jarv-container">
    
    <!-- SIDEBAR DE AGENTES E MÓDULOS -->
    <aside class="jarv-sidebar">
      <div class="history-label">SUBSISTEMAS N2</div>
      <nav class="sidebar-nav">
        <button class="jarv-nav-item active" onclick="switchModule('master', event)"><i class="fa-solid fa-brain"></i> Master Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('brain', event)"><i class="fa-solid fa-network-wired"></i> Segundo Cérebro</button>
        <button class="jarv-nav-item" onclick="switchModule('gmail', event)"><i class="fa-solid fa-envelope"></i> Gmail Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('calendar', event)"><i class="fa-solid fa-calendar-days"></i> Calendar Agent</button>
        <button class="jarv-nav-item" onclick="switchModule('airtable', event)"><i class="fa-solid fa-database"></i> Airtable CRM</button>
        <button class="jarv-nav-item" onclick="switchModule('tavily', event)"><i class="fa-solid fa-globe"></i> Tavily Search</button>
      </nav>
    </aside>

    <!-- PAINEL CENTRAL DE CHAT / CONHECIMENTO -->
    <main class="jarv-main">
      <div class="watermark-bg"></div>

      <!-- ÁREA DE MENSAGENS -->
      <div class="msg-container" id="msgArea"></div>

      <!-- PAINEL SECUNDÁRIO DO SEGUNDO CÉREBRO -->
      <div id="brainModulePanel" style="display: none; flex: 1; flex-direction: column; gap: 15px; z-index: 2; overflow-y: auto; padding: 10px;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px;">
          <h3 style="color: var(--accent-cyan); margin-bottom: 10px;"><i class="fa-solid fa-book-bookmark"></i> Base de Conhecimento - Segundo Cérebro</h3>
          <input type="text" id="brainSearchInput" placeholder="Pesquisar notas, marcações ou documentações..." style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none;" oninput="filterBrainNotes()">
        </div>
        <div id="brainNotesList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Notas injetadas dinamicamente -->
        </div>
      </div>

      <!-- BARRA DE FERRAMENTAS E CAMPO DE TEXTO -->
      <div class="input-section" id="chatInputSection">
        <div class="action-toolbar" style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
          <button class="tool-btn" id="btnMicGlobal" title="Ativar Atalho de Voz (Espaço)" style="background: #222; border: 1px solid #00ffff; color: #00ffff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-microphone"></i> Pressione [ESPAÇO] para falar
          </button>
          
          <label style="color: #00ffff; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; margin-left: auto;">
            <input type="checkbox" id="readAloudToggle" checked style="accent-color: #00ffff;"> Ouvir voz do sistema?
          </label>
          <button class="tool-btn" id="btnStopSpeech" title="Paralisar Voz" onclick="stopJarvisVoice()" style="background: #ff4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-stop"></i> Parar Voz
          </button>
        </div>

        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="Insira suas diretrizes para o Master Agent..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="btn-send" id="executeBtn" onclick="sendMsg()">EXECUTAR</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE BOAS-VINDAS E CONFIGURAÇÃO INICIAL -->
  <div class="modal-overlay" id="welcomeModal" style="display: flex;">
    <div class="modal-card">
      <div class="modal-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="color: #fff; margin-bottom: 10px;">J.A.R.V.I.S. CORE AUTH</h2>
      <p class="subtitle">Sincronização de credenciais de acesso exigida.</p>
      
      <div class="setting-group">
        <label>Identificador do Operador:</label>
        <input type="text" id="setupName" value="Romário" style="background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; outline: none; width: 100%;">
      </div>
      
      <div class="setting-group">
        <label>Protocolo de Tratamento:</label>
        <select id="setupGender">
          <option value="M">Masculino (Sir)</option>
          <option value="F">Feminino (Ma'am)</option>
        </select>
      </div>

      <button onclick="initJarvisSession()" class="btn-send" style="width: 100%; padding: 12px; margin-top: 10px; justify-content: center;">AUTORIZAR ACESSO</button>
    </div>
  </div>

  <!-- SCRIPT EXTERNO MODULARIZADO v5.1 -->
  <script src="js/app.js" defer></script>
</body>
</html>
