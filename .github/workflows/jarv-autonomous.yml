name: J.A.R.V.I.S. Autonomous 24/7

on:
  workflow_dispatch: # Permite disparo manual no painel do GitHub Actions
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas automaticamente

permissions:
  contents: write # Permite que o workflow grave e envie alterações no repositório

jobs:
  run-autonomous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Motor Autônomo J.A.R.V.I.S.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/jarv-autonomous-runner.js

      - name: Commit e Push do Diário Unificado
        run: |
          git config --global user.name "J.A.R.V.I.S. Autonomous Bot"
          git config --global user.email "jarvis-bot@users.noreply.github.com"
          
          # Adiciona todos os arquivos novos ou modificados dentro da pasta IA/ (incluindo o diario-unificado.md)
          git add IA/
          
          # Verifica se há novos arquivos, comita, atualiza e envia (push)
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada. Nada a commitar."
          else
            git commit -m "🤖 [J.A.R.V.I.S.] Sincronização e atualização do Diário Unificado [skip ci]"
            git pull origin main --rebase # Evita conflitos caso você tenha editado o site enquanto o robô rodava
            git push
          fi
