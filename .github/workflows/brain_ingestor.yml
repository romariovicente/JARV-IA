name: J.A.R.V.I.S. Brain Ingestor

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas automaticamente
  workflow_dispatch: # Permite que você execute manualmente pelo painel do GitHub Actions quando quiser

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Brain Ingestor Script
        run: python brain_ingestor.py

      - name: Commit and Push Processed Notes
        run: |
          git config --global user.name "jarvis-bot"
          git config --global user.email "jarvis-bot@users.noreply.github.com"
          git add IA/Segundo_Cérebro/Notes/
          git diff --quiet && git diff --staged --quiet || (git commit -m "[J.A.R.V.I.S.] Auto-ingest new brain notes" && git push)
